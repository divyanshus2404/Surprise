<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Love ❤️</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    .container {
      max-width: 900px;
      padding: 20px;
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      animation: fadeIn 2s ease-in-out;
    }

    .typing {
      font-size: 1.4rem;
      min-height: 50px;
      margin-bottom: 30px;
    }

    .btns {
      margin-top: 20px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      margin: 10px;
      transition: 0.3s;
    }

    #yesBtn {
      background: #fff;
      color: #ff4d6d;
      font-weight: bold;
    }

    #noBtn {
      background: transparent;
      border: 2px solid white;
      color: white;
      position: absolute;
    }

    #finalMessage {
      display: none;
      margin-top: 30px;
      font-size: 1.6rem;
      animation: fadeIn 2s ease-in-out;
    }

    /* Floating Hearts */
    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: float 6s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(45deg);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px) scale(0.95);} 
      to {opacity: 1; transform: translateY(0) scale(1);} 
    }

    /* Background Animation */
    body {
      animation: gradientMove 8s ease infinite alternate;
    }

    @keyframes gradientMove {
      0% {filter: hue-rotate(0deg);} 
      100% {filter: hue-rotate(20deg);} 
    }

    /* Button Pulse */
    #yesBtn {
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% {transform: scale(1);} 
      50% {transform: scale(1.08);} 
      100% {transform: scale(1);} 
    } 
      to {opacity: 1; transform: translateY(0);} 
    }
  </style>
</head>
<body>

  <!-- Password Screen -->
  <div id="passwordScreen" style="position:fixed;inset:0;background:linear-gradient(135deg,#ff9a9e,#fad0c4);display:flex;justify-content:center;align-items:center;z-index:9999;flex-direction:column;color:white;text-align:center;">
    <h2 style="margin-bottom:20px;">Enter Secret Password 🔐</h2>
    <input id="passwordInput" type="password" placeholder="Enter password..." style="padding:10px 15px;border:none;border-radius:20px;outline:none;font-size:1rem;text-align:center;">
    <button onclick="checkPassword()" style="margin-top:15px;padding:10px 20px;border:none;border-radius:20px;background:white;color:#ff4d6d;font-weight:bold;cursor:pointer;">Unlock 💌</button>
    <p id="errorMsg" style="margin-top:10px;color:#fff;font-size:0.9rem;"></p>
  </div>

  <!-- Floating Hearts -->
  <script>
    for (let i = 0; i < 25; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = 4 + Math.random() * 4 + 's';
      document.body.appendChild(heart);
    }
  </script>

  <div class="container">
    <h1>Hey Manosmita ❤️</h1>

    <div class="typing" id="typing"></div>

    <div class="btns">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😝</button>
    </div>

    <div id="finalMessage">
      I knew it 😌❤️ <br><br>
      You are the best thing that ever happened to me.
      <br>
      So… I guess this is how our cute little story begins 😌❤️
    </div>
  </div>

  <!-- Background Music -->
  <audio id="music" autoplay loop>
    <source src="https://www2.cs.uic.edu/~i101/SoundFiles/Perfect.wav" type="audio/wav">
  </audio>

  <script>
    const text = [
      "I made something special for you... ❤️",
      "Because you are genuinely special... ✨",
      "I love the way we started talking... 🥺",
      "It just feels easy with you... 🌸",
      "So I wanted to ask you something… 💌",
      "Will you be my \"FRIEND\" 😉😝"
    ];

    let i = 0;
    let j = 0;
    let current = '';
    let isDeleting = false;

    function type() {
      document.getElementById('typing').innerHTML = current;

      if (i < text.length) {
        if (!isDeleting && j <= text[i].length) {
          current = text[i].substring(0, j++);
        }

        if (isDeleting && j >= 0) {
          current = text[i].substring(0, j--);
        }

        if (j === text[i].length) {
          isDeleting = true;
          setTimeout(type, 1400);
          return;
        }

        if (isDeleting && j === 0) {
          isDeleting = false;
          i++;

          if (i === text.length) {
            document.getElementById('typing').innerHTML = text[text.length - 1];
            return; // Stops extra glitch letters like W
          }
        }
      }

      setTimeout(type, isDeleting ? 35 : 70);
    }

    type();

    // Yes Button
    document.getElementById('yesBtn').onclick = () => {
      document.getElementById('finalMessage').style.display = 'block';
    };

    // No Button Teleport
    const noBtn = document.getElementById('noBtn');

    noBtn.addEventListener('mouseover', () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
    });
  </script>


<script>
  function checkPassword() {
    const pass = document.getElementById('passwordInput').value.toLowerCase();

    if (pass === 'bhondhu') {
      document.getElementById('passwordScreen').style.display = 'none';
    } else {
      document.getElementById('errorMsg').innerText = 'Wrong password 😝 Try again!';
    }
  }
</script>

</body>
</html>
